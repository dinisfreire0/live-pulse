services:
  backend:
    build: ./backend
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
